[package]
name = "audio_lock"
version = "0.1.0"
edition = "2024"
description = "Stops apps changing your mic level and Windows switching your default audio device."
repository = "https://github.com/fredle/audio-lock"

[dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["glow", "default_fonts"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
velopack = "1.2"
# Already in the build through velopack; used to send in-app feedback.
ureq = "3"
# COM bindings for Core Audio (endpoint volume, device enumeration).
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_UI_Shell_PropertiesSystem", "Win32_Devices_FunctionDiscovery", "Win32_System_SystemInformation", "Win32_System_Registry"] }
# The #[implement]/#[interface] macros expand to paths in this crate (already
# pulled in by `windows`).
windows-core = "0.62"
# System tray icon and menu (pause toggle).
tray-icon = { version = "0.26", default-features = false }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[build-dependencies]
winresource = "0.1.31"
